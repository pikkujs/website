name: CI
run-name: Typecheck, build and link gate (no deploy; Studio deploys the site)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # prebuild runs `pikku all`; the app build prerenders every page and fails on a broken internal link
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run --filter @project/app tsc

      - name: Lint
        run: bun run --filter @project/app lint
