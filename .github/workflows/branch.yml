name: Branch
run-name: Build, typecheck and link-gate (no deploy)
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run sync-snippets
      - name: Sync registry (best effort)
        run: npm run sync-registry || echo "registry sync failed, using the committed snapshot"
      - run: npm run typecheck
      # includes the link gate
      - run: npm run build
