name: Main
run-name: Build, publish image and deploy pikku.dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pikkujs/website

jobs:
  build:
    name: Build, typecheck, link gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Snippets are generated from the template submodule.
      - run: npm run sync-snippets

      # The hosted registry can be down; the vendored catalogue in src/data is the fallback.
      - name: Sync registry (best effort)
        run: npm run sync-registry || echo "registry sync failed, using vendored data"

      - run: npm run typecheck
      # `npm run build` also runs the link gate (vite-link-check) and fails on broken internal links
      - run: npm run build
      - run: npm run check-links

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner and purge Cloudflare
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://pikku.dev
    steps:
      # Needs secrets HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY. The host runs deploy/docker-compose.yml
      # from /opt/pikku-website and is logged in to ghcr.io (read:packages token).
      - name: Pull and restart on the host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pikku-website
            docker compose pull
            docker compose up -d
            docker image prune -f

      # Needs secrets CLOUDFLARE_ZONE_ID, CLOUDFLARE_API_TOKEN (Zone > Cache Purge). Purges after the new
      # container is up, so the edge refills from the new version.
      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
