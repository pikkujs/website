name: Main
run-name: Deploy to Cloudflare
on:
  push:
    branches:
      - main

# One deploy at a time; let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run sync-snippets
      # Refreshes the vendored addon / OpenAPI catalogue, including the per-spec detail files (generated, not
      # tracked). Best effort: if the hosted registry is down the committed snapshot is used.
      - name: Sync registry (best effort)
        run: npm run sync-registry || echo "registry sync failed, using the committed snapshot"
      - run: npm run typecheck
      # prerenders into dist/client, runs the link gate (fails on any broken internal link), then builds the Worker
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
