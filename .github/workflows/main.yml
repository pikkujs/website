name: Main
run-name: Build and deploy pikku.dev (Cloudflare Worker)
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Snippets are generated from the template submodule; skip if the script is absent.
      - name: Sync snippets
        run: |
          if grep -q '"sync-snippets"' package.json; then npm run sync-snippets; fi

      # The hosted registry can be down; the vendored catalogue in src/data is the fallback.
      - name: Sync registry (best effort)
        run: |
          if grep -q '"sync-registry"' package.json; then npm run sync-registry || echo "registry sync failed, using vendored data"; fi

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://pikku.dev
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      # Deploys the prebuilt dist/ (dist/server/wrangler.json is generated by the build and points at dist/client).
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
