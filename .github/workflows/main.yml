name: Main
run-name: Publish to github pages
on:
  push:
    branches:
      - main

# One deploy at a time; let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run sync-snippets
      # Refreshes the vendored addon / OpenAPI catalogue, including the per-spec detail files (generated, not
      # tracked). Best effort: if the hosted registry is down the committed snapshot is used.
      - name: Sync registry (best effort)
        run: npm run sync-registry || echo "registry sync failed, using the committed snapshot"
      - run: npm run typecheck
      # prerenders everything into dist/client and runs the link gate (fails on any broken internal link)
      - run: npm run build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/

  deploy:
    name: Deploy to github pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
